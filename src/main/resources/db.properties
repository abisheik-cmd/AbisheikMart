# H2 Database & HikariCP Connection Pool Configuration
# Deployment default: connect to the separately managed H2 TCP server.
# Override with DB_URL/DB_USERNAME/DB_PASSWORD environment variables when needed.
db.url=jdbc:h2:tcp://127.0.0.1:9123/./abisheikmartdb;DB_CLOSE_DELAY=-1
db.driver=org.h2.Driver
db.username=sa
db.password=

# HikariCP Pool Settings
hikari.maximumPoolSize=10
hikari.minimumIdle=2
hikari.idleTimeout=300000
hikari.connectionTimeout=20000
hikari.poolName=AbisheikMartHikariPool
